<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEZ.CART — Modern Dropshipping India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #000000;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --muted: #8a8a99;
    --accent: #00c3ff;
    --accent-2: #00e0ff;
    --glow: rgba(0,195,255,0.45);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ===== AMBIENT BACKGROUND ===== */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .ambient .blob {
    position: absolute;
    background: var(--accent);
    opacity: 0.12;
    filter: blur(100px);
    will-change: transform;
  }
  .blob-1 {
    width: 500px; height: 500px;
    top: -180px; right: -120px;
    border-radius: 45% 55% 60% 40% / 50% 45% 55% 50%;
    animation: blobFloat1 16s ease-in-out infinite;
  }
  .blob-2 {
    width: 550px; height: 550px;
    bottom: -200px; left: -150px;
    border-radius: 60% 40% 45% 55% / 45% 60% 40% 55%;
    animation: blobFloat2 20s ease-in-out infinite;
  }
  .blob-3 {
    width: 350px; height: 350px;
    top: 45%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50% 50% 45% 55% / 55% 45% 55% 45%;
    opacity: 0.06;
    animation: blobFloat3 24s ease-in-out infinite;
  }
  @keyframes blobFloat1 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-40px, 50px) scale(1.1); }
  }
  @keyframes blobFloat2 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(60px, -40px) scale(1.12); }
  }
  @keyframes blobFloat3 {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.06; }
    50% { transform: translate(-50%, -50%) scale(1.25); opacity: 0.09; }
  }

  .grid-overlay {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,195,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,195,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 1;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 85%);
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 2rem;
    width: 100%;
  }

  /* ========== HERO ========== */
  .hero {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    padding: 4rem 0 2rem;
  }

  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.5rem, 10vw, 6rem);
    font-weight: 700;
    letter-spacing: -0.05em;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.75rem;
    line-height: 1;
  }
  .brand .dot {
    width: 0.18em;
    height: 0.18em;
    background: var(--accent);
    border-radius: 50%;
    margin: 0 0.06em;
    box-shadow: 0 0 30px var(--glow);
    animation: dotPulse 2s ease-in-out infinite;
    display: inline-block;
    vertical-align: middle;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 30px var(--glow); }
    50% { opacity: 0.7; transform: scale(1.3); box-shadow: 0 0 50px var(--glow); }
  }

  .hero p {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: var(--muted);
    max-width: 560px;
    margin: 0 auto;
    font-weight: 400;
    line-height: 1.7;
  }

  .hero p strong {
    color: var(--accent);
    font-weight: 600;
  }

  /* ===== SOCIAL SECTION ===== */
  .social-section {
    padding: 2rem 0 6rem;
    text-align: center;
  }

  .social-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1.3rem, 3vw, 1.6rem);
    font-weight: 600;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }

  .social-subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 3rem;
  }

  .social-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.25rem;
  }

  .social-card {
    position: relative;
    padding: 2rem 1rem;
    border-radius: 22px;
    background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    overflow: hidden;
    transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1),
                box-shadow 0.35s cubic-bezier(0.2, 0.9, 0.3, 1),
                border-color 0.35s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    backdrop-filter: blur(10px);
    -webkit-tap-highlight-color: transparent;
  }

  .social-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.35s ease;
    z-index: 0;
    background: radial-gradient(circle at top right, rgba(0,195,255,0.18), transparent 65%);
  }

  .social-card:hover {
    transform: translateY(-8px);
    border-color: rgba(0,195,255,0.4);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 0 50px -15px var(--glow);
  }
  .social-card:hover::before { opacity: 1; }

  .social-card > * { position: relative; z-index: 1; }

  .social-icon {
    width: 62px;
    height: 62px;
    border-radius: 18px;
    background: rgba(0,195,255,0.06);
    border: 1px solid rgba(0,195,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.65rem;
    margin-bottom: 1.1rem;
    transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1),
                background 0.35s ease,
                color 0.35s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease;
    color: var(--accent);
  }
  .social-card:hover .social-icon {
    transform: scale(1.12) rotate(-8deg);
    color: #000;
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 35px -5px var(--glow);
  }

  .social-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  /* ===== FOOTER ===== */
  footer {
    padding: 2.5rem 0;
    text-align: center;
    border-top: 1px solid var(--border);
    position: relative;
    z-index: 2;
  }
  footer p {
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* ===== FAST REVEAL ANIMATIONS ===== */
  .reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s cubic-bezier(0.2, 0.9, 0.3, 1),
                transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
    will-change: opacity, transform;
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .reveal-1 { transition-delay: 0.05s; }
  .reveal-2 { transition-delay: 0.1s; }
  .reveal-3 { transition-delay: 0.15s; }
  .reveal-4 { transition-delay: 0.2s; }
  .reveal-5 { transition-delay: 0.25s; }
  .reveal-6 { transition-delay: 0.3s; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 1024px) {
    .container { max-width: 100%; padding: 0 1.75rem; }
  }

  @media (max-width: 768px) {
    .hero { padding: 3rem 0 2rem; }
    .social-section { padding: 1.5rem 0 4rem; }
    .social-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    .social-subtitle { margin-bottom: 2rem; }
    .social-icon {
      width: 58px;
      height: 58px;
      font-size: 1.5rem;
    }
  }

  @media (max-width: 640px) {
    .container { padding: 0 1.25rem; }
    .social-icon {
      width: 54px;
      height: 54px;
      font-size: 1.4rem;
      border-radius: 16px;
    }
    .social-name { font-size: 0.9rem; }
    .social-card { padding: 1.75rem 0.75rem; }
  }

  @media (max-width: 480px) {
    .brand { margin-bottom: 1.25rem; }
    .social-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
    .social-card {
      padding: 1.5rem 0.5rem;
      border-radius: 18px;
    }
    .social-icon {
      width: 48px;
      height: 48px;
      font-size: 1.25rem;
      border-radius: 14px;
      margin-bottom: 0.85rem;
    }
    .social-name { font-size: 0.85rem; }
    .social-title { font-size: 1.2rem; }
    .social-subtitle { font-size: 0.85rem; margin-bottom: 1.75rem; }
  }

  @media (max-width: 360px) {
    .container { padding: 0 1rem; }
    .social-grid { gap: 0.6rem; }
    .social-card { padding: 1.25rem 0.4rem; }
    .social-icon {
      width: 44px;
      height: 44px;
      font-size: 1.15rem;
    }
    .social-name { font-size: 0.8rem; }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    .hero {
      min-height: auto;
      padding: 5rem 0 2rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<!-- Ambient background -->
<div class="ambient">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div class="grid-overlay"></div>

<!-- HERO -->
<section class="hero">
  <div class="container">
    <div class="brand reveal reveal-1">
      HEZ<span class="dot"></span>CART
    </div>
    <p class="reveal reveal-2">
      Modern dropshipping, delivered <strong>all over India</strong>.<br>
      Curated products, seamless experience, and a brand you can trust.
    </p>
  </div>
</section>

<!-- SOCIAL SECTION -->
<section class="social-section">
  <div class="container">

    <h2 class="social-title reveal reveal-3">Connect with us</h2>
    <p class="social-subtitle reveal reveal-4">We're active on every platform you love.</p>

    <div class="social-grid">
      <a href="https://instagram.com/hez.cart" target="_blank" rel="noopener" class="social-card reveal reveal-4">
        <div class="social-icon"><i class="fab fa-instagram"></i></div>
        <div class="social-name">Instagram</div>
      </a>
      <a href="https://t.me/hezcart" target="_blank" rel="noopener" class="social-card reveal reveal-5">
        <div class="social-icon"><i class="fab fa-telegram"></i></div>
        <div class="social-name">Telegram</div>
      </a>
      <a href="https://facebook.com/hezcart" target="_blank" rel="noopener" class="social-card reveal reveal-5">
        <div class="social-icon"><i class="fab fa-facebook-f"></i></div>
        <div class="social-name">Facebook</div>
      </a>
      <a href="https://pinterest.com/hezcart" target="_blank" rel="noopener" class="social-card reveal reveal-6">
        <div class="social-icon"><i class="fab fa-pinterest-p"></i></div>
        <div class="social-name">Pinterest</div>
      </a>
    </div>

  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="container">
    <p>© 2025 HEZ.CART — Modern Dropshipping India</p>
  </div>
</footer>

<script>
  // ===== FAST SCROLL REVEAL =====
  const revealElements = document.querySelectorAll('.reveal');
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        revealObserver.unobserve(entry.target);
      }
    });
  }, {
    threshold: 0.05,
    rootMargin: '0px 0px -20px 0px'
  });

  revealElements.forEach(el => revealObserver.observe(el));

  // ===== FORCE REVEAL ON PAGE LOAD (so hero + social show instantly) =====
  window.addEventListener('load', () => {
    document.querySelectorAll('.reveal').forEach(el => {
      const rect = el.getBoundingClientRect();
      if (rect.top < window.innerHeight) {
        el.classList.add('visible');
      }
    });
  });

  // ===== SUBTLE PARALLAX ON BLOBS =====
  if (window.matchMedia('(pointer: fine)').matches) {
    let ticking = false;
    document.addEventListener('mousemove', (e) => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          const x = (e.clientX / window.innerWidth - 0.5) * 2;
          const y = (e.clientY / window.innerHeight - 0.5) * 2;
          const blob1 = document.querySelector('.blob-1');
          const blob2 = document.querySelector('.blob-2');
          if (blob1) blob1.style.transform = `translate(${x * 25}px, ${y * 25}px) scale(1)`;
          if (blob2) blob2.style.transform = `translate(${x * -20}px, ${y * -20}px) scale(1)`;
          ticking = false;
        });
        ticking = true;
      }
    });
  }
</script>

</body>
</html>
